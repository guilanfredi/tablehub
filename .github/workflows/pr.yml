name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Design system
        run: node scripts/check-design-system.mjs
      - name: Tokens
        run: node scripts/gen-tokens.mjs --check
      - name: Testes (inclui a bateria de conformidade de todos os jogos)
        run: npm test
      - name: Build
        run: npm run build

  # regressão completa no navegador (desktop + mobile), dividida em partes paralelas; o despachante dos agentes
  # só chama QA/Revisor com `test` e `e2e` verdes (.agents/config.json)
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes ponta a ponta (parte ${{ matrix.shard }} de 2)
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Capturas e traces das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  preview:
    name: preview
    needs: test
    # PRs vindos de forks não recebem segredos nem ambiente de preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: tablehub-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publica o Worker de preview deste PR
        id: deploy
        run: scripts/deploy.sh "$WORKER_NAME"
      - name: Smoke test no preview
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.url }}"
      - name: Comenta a URL no PR
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- tablehub-preview -->';
            const body = `${marker}\n### 🎲 Preview deste PR\n${url}\n\nSalas deste ambiente são isoladas da produção. Smoke test: ✅ passou.\nCommit: ${context.payload.pull_request.head.sha.slice(0, 7)}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
